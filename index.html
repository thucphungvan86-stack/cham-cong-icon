<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>CHẤM CÔNG V2.4.6</title>

  <meta name="theme-color" content="#0b5fc6">

  <link rel="apple-touch-icon"
        href="CHAM_CONG_ICON_V2_4_6_180.png?v=2461">

  <link rel="apple-touch-icon-precomposed"
        href="CHAM_CONG_ICON_V2_4_6_180.png?v=2461">

  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="CHAM_CONG_ICON_V2_4_6_192.png?v=2461">

  <link rel="manifest"
        href="manifest.webmanifest?v=2461">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    #appFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #openDirect {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 9999;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #0b5fc6;
      color: white;
      font-weight: bold;
      display: none;
    }
  </style>
</head>

<body>

<iframe
  id="appFrame"
  allow="camera; microphone"
></iframe>

<button id="openDirect">
  MỞ TRỰC TIẾP
</button>

<script>
  const APP_URL =
    "https://script.google.com/macros/s/AKfycbzoj6YDvTdDYASXjNnEt5WzifJl6fx0VwORD6Ph0-P30UYP4sHo12kg9hptrqgKQ6o/exec";

  // Quan trọng:
  // thêm phiên bản để không tải giao diện Apps Script cũ từ cache.
  const APP_VERSION = "2.4.6.1";

  const finalUrl =
    APP_URL +
    "?launcherVersion=" +
    encodeURIComponent(APP_VERSION) +
    "&t=" +
    Date.now();

  const frame = document.getElementById("appFrame");
  const directBtn = document.getElementById("openDirect");

  frame.src = finalUrl;

  directBtn.onclick = function () {
    window.location.href = finalUrl;
  };

  // Nếu iframe có vấn đề thì hiện nút mở trực tiếp
  setTimeout(function () {
    directBtn.style.display = "block";
  }, 5000);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register(
      "./sw.js?v=2461"
    );
  }
</script>

</body>
</html>
