<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>CHẤM CÔNG V2.4.6</title>

  <meta name="theme-color" content="#0b5fc6">

  <link rel="apple-touch-icon"
        href="CHAM_CONG_ICON_V2_4_6_180.png?v=2462">

  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="CHAM_CONG_ICON_V2_4_6_192.png?v=2462">

  <link rel="manifest"
        href="manifest.webmanifest?v=2462">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>

<iframe id="app"></iframe>

<script>
const APP_URL =
"https://script.google.com/macros/s/AKfycbzoj6YDvTdDYASXjNnEt5WzifJl6fx0VwORD6Ph0-P30UYP4sHo12kg9hptrqgKQ6o/exec";

// Xóa service worker cũ
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(reg) {
      reg.unregister();
    });
  });
}

// Xóa cache launcher cũ
if ("caches" in window) {
  caches.keys().then(function(keys) {
    keys.forEach(function(key) {
      caches.delete(key);
    });
  });
}

// Luôn gọi Apps Script mới nhất
document.getElementById("app").src =
  APP_URL +
  "?launcher=2.4.6.2&time=" +
  Date.now();
</script>

</body>
</html>
